<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Мои смены · Курьер</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Unbounded:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f0ff;--card:#fff;--tx:#1f1b3a;--mut:#7b7799;--pr:#6c5ce7;--pr2:#a29bfe;--ok:#00b894;--bad:#ff6b81;--line:#ece8ff;--sh:0 10px 30px rgba(108,92,231,.13);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14121f;--card:#1f1c33;--tx:#f1efff;--mut:#9a96b8;--line:#2d2948;--sh:none}}
:root[data-theme="dark"]{--bg:#14121f;--card:#1f1c33;--tx:#f1efff;--mut:#9a96b8;--line:#2d2948;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;background-image:radial-gradient(circle at 10% -5%,rgba(162,155,254,.45),transparent 40%),radial-gradient(circle at 100% 10%,rgba(0,184,148,.2),transparent 35%);background-attachment:fixed}
main{max-width:520px;margin:0 auto;padding:22px 16px 110px}
h1{font-size:28px;margin:6px 0 2px;font-weight:800}.sub{color:var(--mut);margin:0 0 16px;font-weight:500;text-transform:capitalize}
.card{background:var(--card);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}
label{font-size:12px;font-weight:700;color:var(--mut);display:block}
input[type=text],input[type=number],input[type=date],input[type=time],textarea{width:100%;margin-top:6px;padding:13px 14px;border:2px solid var(--line);background:transparent;color:var(--tx);border-radius:14px;font:700 16px Manrope,system-ui,sans-serif;outline:none;min-width:0}
input:focus,textarea:focus{border-color:var(--pr)}
.hero{background:linear-gradient(135deg,#6c5ce7,#a29bfe 60%,#74b9ff);color:#fff}
.hero .big{font-size:38px;font-weight:800;margin:2px 0 10px}.hero small{opacity:.85;font-weight:600}
.ln{display:flex;justify-content:space-between;padding:6px 0;font-weight:600;font-size:14px;border-top:1px solid rgba(255,255,255,.22)}
.btn{width:100%;border:0;border-radius:18px;padding:16px;font:800 16px Manrope,system-ui,sans-serif;color:#fff;background:linear-gradient(135deg,#6c5ce7,#8e7dff);box-shadow:0 10px 24px rgba(108,92,231,.35);cursor:pointer;margin-bottom:10px}
.btn:active{transform:scale(.98)}.btn.ghost{background:var(--card);color:var(--pr);box-shadow:var(--sh)}.btn.del{background:#ff6b81;box-shadow:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
nav div{display:flex;gap:4px;background:var(--card);border-radius:26px;padding:6px;box-shadow:0 8px 30px rgba(60,40,160,.22);width:100%;max-width:520px}
nav button{flex:1;border:0;background:none;color:var(--mut);font:700 11px Manrope,system-ui,sans-serif;padding:8px 2px;border-radius:20px;cursor:pointer}
nav button b{display:block;font-size:20px;margin-bottom:2px}nav button.on{background:var(--pr);color:#fff}
.it{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border-radius:20px;margin-bottom:10px;box-shadow:var(--sh);cursor:pointer}
.it .d{width:46px;height:46px;border-radius:14px;background:var(--line);display:grid;place-items:center;font-weight:800;color:var(--pr);flex:none}
.it .m{flex:1;min-width:0}.it .m b{display:block;text-transform:capitalize}.it .m span{color:var(--mut);font-size:12px;font-weight:600}
.it .n{font-weight:800;color:var(--ok);white-space:nowrap}
.mh{display:flex;justify-content:space-between;color:var(--mut);font-weight:800;margin:18px 4px 10px;text-transform:capitalize}
.seg{display:flex;background:var(--card);border-radius:18px;padding:5px;margin-bottom:14px;box-shadow:var(--sh)}
.seg button{flex:1;border:0;background:none;color:var(--mut);font:800 14px Manrope,system-ui,sans-serif;padding:10px;border-radius:14px;cursor:pointer}.seg .on{background:var(--pr);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.grid div{background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--sh)}.grid span{font-size:12px;color:var(--mut);font-weight:700}.grid b{display:block;font-size:19px;margin-top:4px}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;margin-top:8px}.bars i{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-style:normal;font-size:10px;color:var(--mut);font-weight:700}
.bars u{width:100%;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,#a29bfe,#6c5ce7);min-height:4px;margin-bottom:4px}
.empty{text-align:center;color:var(--mut);padding:40px 10px;font-weight:600}
.chk{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--tx);margin-top:14px}.chk input{width:22px;height:22px;accent-color:var(--pr)}
.note{font-size:12px;color:var(--mut);line-height:1.5;margin:10px 0 0}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-90px);background:var(--ok);color:#fff;padding:12px 20px;border-radius:16px;font-weight:800;transition:.3s;z-index:9}#toast.s{transform:translate(-50%,0)}
.tp{margin:0!important;padding:14px 6px!important}.tp.on{background:var(--pr);color:#fff}
.x{border:0;background:var(--line);color:var(--mut);width:34px;height:34px;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer}
:root:root:root{--bg:#050505;--card:#fff;--tx:#000;--mut:#6b6b6b;--pr:#000;--pr2:#777;--ok:#000;--bad:#000;--line:#e4e4e4;--sh:5px 5px 0 #6b6b6b}
body{background:#050505;background-image:none;color:#fff}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 800' preserveAspectRatio='xMidYMid slice'><defs><radialGradient id='o' cx='35%25' cy='30%25' r='75%25'><stop offset='0' stop-color='%23fff'/><stop offset='.35' stop-color='%23888'/><stop offset='1' stop-color='%23111'/></radialGradient><pattern id='d' width='10' height='10' patternUnits='userSpaceOnUse'><circle cx='5' cy='5' r='1.6' fill='%23fff' opacity='.13'/></pattern><path id='s' d='M0-20Q2-2 20 0Q2 2 0 20Q-2 2-20 0Q-2-2 0-20Z'/></defs><rect width='400' height='800' fill='%23050505'/><rect width='400' height='520' fill='url(%23d)'/><circle cx='320' cy='120' r='70' fill='url(%23o)'/><circle cx='55' cy='440' r='34' fill='url(%23o)'/><circle cx='352' cy='520' r='16' fill='url(%23o)'/><ellipse cx='200' cy='300' rx='170' ry='42' fill='none' stroke='%23fff' stroke-opacity='.4' stroke-width='3' transform='rotate(-20 200 300)'/><ellipse cx='200' cy='300' rx='190' ry='55' fill='none' stroke='%23fff' stroke-opacity='.15' stroke-width='1' transform='rotate(-20 200 300)'/><g stroke='%23fff' stroke-opacity='.28' fill='none'><path d='M200 560L-200 800M200 560L0 800M200 560L100 800M200 560L200 800M200 560L300 800M200 560L400 800M200 560L600 800'/><path d='M0 590H400M0 630H400M0 690H400M0 770H400'/></g><g fill='%23fff'><use href='%23s' transform='translate(70 110) scale(1.5)'/><use href='%23s' transform='translate(330 300) scale(.8)'/><use href='%23s' transform='translate(40 270) scale(.6)'/><use href='%23s' transform='translate(250 440) scale(1.1)'/><use href='%23s' transform='translate(150 40) scale(.5)'/><use href='%23s' transform='translate(370 450) scale(.5)'/><use href='%23s' transform='translate(110 520) scale(.7)'/></g></svg>") center/cover no-repeat}
h1,.hero .big{font-family:Unbounded,Manrope,system-ui,sans-serif;font-weight:700}
h1{font-size:24px;text-transform:uppercase;letter-spacing:-.5px}.hero .big{font-size:30px}
.sub,.mh,.empty{color:#c4c4c4}
.card,.it,.grid div,.seg{color:#000;border:2px solid #000}
.hero{color:#fff!important;background:linear-gradient(145deg,#3a3a3a,#0a0a0a 40%,#2a2a2a 62%,#050505);border:2px solid #fff}.hero small{color:#ddd}
.btn{background:#000;color:#fff;border:2px solid #fff;box-shadow:4px 4px 0 #fff}
.card .btn{border-color:#000;box-shadow:3px 3px 0 #aaa}
.btn.ghost{background:#fff;color:#000;border-color:#000;box-shadow:4px 4px 0 #777}
.btn.del{background:#555;color:#fff}
.tp.on,.seg .on{background:#000;color:#fff}
#cl{background:#fff!important;color:#000!important;border:2px solid #000;box-shadow:4px 4px 0 #888!important}
nav div{border:2px solid #000;box-shadow:5px 5px 0 #666}
.it .d{background:#000;color:#fff}
.bars u{background:linear-gradient(180deg,#777,#000)}
#toast{background:#fff;color:#000;border:2px solid #000}
#bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#bg>*{position:absolute}
#bg .o{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#8a8a8a 38%,#111);animation:fo 9s ease-in-out infinite alternate}
#bg .s{width:26px;height:26px;background:#fff;clip-path:polygon(50% 0,59% 41%,100% 50%,59% 59%,50% 100%,41% 59%,0 50%,41% 41%);animation:tw 3.2s ease-in-out infinite}
#bg .rg{left:50%;top:34%;width:360px;height:96px;margin:-48px 0 0 -180px;border:3px solid rgba(255,255,255,.45);border-radius:50%;animation:rg 18s linear infinite}
#bg .fw{left:-60%;right:-60%;bottom:0;height:46%;overflow:hidden;transform:perspective(320px) rotateX(64deg);transform-origin:50% 100%;background:rgba(5,5,5,.8);-webkit-mask-image:linear-gradient(to top,#000 35%,transparent);mask-image:linear-gradient(to top,#000 35%,transparent)}
#bg .fl{position:absolute;left:0;right:0;top:-60px;bottom:0;background-image:linear-gradient(rgba(255,255,255,.4) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.4) 2px,transparent 2px);background-size:60px 60px;animation:gm 1.4s linear infinite}
.hero{position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.2) 50%,transparent 60%);transform:translateX(-100%);animation:gl 5s ease-in-out infinite;pointer-events:none}
@keyframes fo{to{transform:translate(20px,-38px)}}
@keyframes tw{0%,100%{opacity:.12;transform:scale(calc(var(--k)*.4)) rotate(0)}50%{opacity:1;transform:scale(var(--k)) rotate(90deg)}}
@keyframes rg{from{transform:rotate(-20deg)}to{transform:rotate(340deg)}}
@keyframes gm{to{transform:translateY(60px)}}
@keyframes gl{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){#bg *,.hero::after{animation:none!important}}
.g2,.row,.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.g2>*,.row>*,.grid>*,.seg button{min-width:0}
.grid b{overflow-wrap:anywhere}
input{display:block;max-width:100%;min-width:0;min-height:52px;line-height:1.3;text-align:left;margin-left:0;margin-right:0;-webkit-appearance:none;appearance:none}
input::-webkit-date-and-time-value{text-align:left;min-height:1.3em}
input[type=checkbox]{-webkit-appearance:auto;appearance:auto;min-height:0;width:22px;height:22px}
</style></head><body>
<div id="bg"><i class="o" style="width:54px;height:54px;left:7%;top:22%"></i><i class="o" style="width:92px;height:92px;right:-26px;top:52%;animation-duration:12s;animation-delay:-4s"></i><i class="o" style="width:30px;height:30px;left:72%;top:12%;animation-duration:7s"></i><i class="rg"></i><i class="s" style="left:14%;top:12%;--k:1.5"></i><i class="s" style="left:82%;top:26%;--k:1;animation-delay:-1s"></i><i class="s" style="left:6%;top:46%;--k:.8;animation-delay:-2s"></i><i class="s" style="left:60%;top:8%;--k:.7;animation-delay:-.5s"></i><i class="s" style="left:46%;top:40%;--k:1.2;animation-delay:-1.6s"></i><i class="s" style="left:90%;top:6%;--k:.6;animation-delay:-2.4s"></i><i class="s" style="left:30%;top:30%;--k:.6;animation-delay:-.8s"></i><i class="s" style="left:72%;top:44%;--k:.9;animation-delay:-2s"></i><i class="s" style="left:20%;top:56%;--k:.7;animation-delay:-1.2s"></i><div class="fw"><div class="fl"></div></div></div>
<main id="v"></main><div id="toast"></div>
<nav><div><button data-t="shift"><b>🚗</b>Смена</button><button data-t="hist"><b>📒</b>История</button><button data-t="stat"><b>📊</b>Итоги</button><button data-t="set"><b>⚙️</b>Настройки</button></div></nav>
<script>
const $=s=>document.querySelector(s);
let S={shifts:[],set:{comm:13,tax:4,taxCash:false}},tab='shift',per='month',edit=null;
try{const d=JSON.parse(localStorage.getItem('courier')||'null');if(d)S=Object.assign(S,d)}catch(e){}
const save=()=>{try{localStorage.setItem('courier',JSON.stringify(S))}catch(e){}};
const R=n=>Math.round(n).toLocaleString('ru-RU')+' ₽',p2=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const fd=(s,o)=>new Date(s+'T00:00').toLocaleDateString('ru-RU',o||{weekday:'long',day:'numeric',month:'long'});
const mins=t=>+t.slice(0,2)*60+ +t.slice(3,5);
const hrs=(a,b)=>{let x=mins(b)-mins(a);if(x<=0)x+=1440;return x/60};
const blank=()=>({date:today(),start:'18:00',end:'00:00',card:'',cash:'',orders:'',gas:''});
let F=blank();
function calc(s){const c=S.set,cd=+s.card||0,cs=+s.cash||0,g=cd+cs,cm=g*c.comm/100,tx=(cd+(c.taxCash?cs:0))*c.tax/100,gas=+s.gas||0;
return{g,cm,tx,gas,net:g-cm-tx-gas,h:hrs(s.start||'18:00',s.end||'00:00'),o:+s.orders||0}}
function agg(l){const r={g:0,cm:0,tx:0,gas:0,net:0,h:0,o:0,n:l.length};l.forEach(s=>{const c=calc(s);for(const k of['g','cm','tx','gas','net','h','o'])r[k]+=c[k]});return r}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('s');setTimeout(()=>e.classList.remove('s'),1800)}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));({shift:vShift,hist:vHist,stat:vStat,set:vSet})[tab]();scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{if(b.dataset.t!==tab){edit=null;manual=false;F=blank()}tab=b.dataset.t;render()});

function pv(o){const c=calc(o||F);$('#pv').innerHTML=`<small>Чистыми на руки</small><div class="big">${R(c.net)}</div>
<div class="ln"><span>Выручка</span><span>${R(c.g)}</span></div>
<div class="ln"><span>Пополнить в Анжи (${S.set.comm}%)</span><span>−${R(c.cm)}</span></div>
<div class="ln"><span>Налог (${S.set.tax}%)</span><span>−${R(c.tx)}</span></div>
<div class="ln"><span>Газ</span><span>−${R(c.gas)}</span></div>
<div class="ln"><span>Часов в смене · в час</span><span>${c.h.toFixed(1)} ч · ${R(c.net/c.h)}</span></div>`}
let manual=false,OT='card';
const ask=(b,t,f)=>{if(b.dataset.a){f();return}b.dataset.a=1;const o=b.textContent;b.textContent=t;setTimeout(()=>{delete b.dataset.a;b.textContent=o},3000)};
const nowHM=()=>{const d=new Date();return p2(d.getHours())+':'+p2(d.getMinutes())};
function liveShift(){const L=S.live;let cd=0,cs=0;L.orders.forEach(o=>o.type==='card'?cd+=o.amt:cs+=o.amt);return{date:L.date,start:L.start,end:nowHM(),card:cd,cash:cs,orders:L.orders.length,gas:L.gas}}
function vShift(){
if(edit||manual)return vManual();
const L=S.live;
if(!L){$('#v').innerHTML=`<h1>Привет! 👋</h1><p class="sub">${fd(today())}</p><div class="card"><label>Начало смены<input type="time" id="st" value="${nowHM()}"></label></div><button class="btn" id="go">▶ Начать смену</button><button class="btn ghost" id="mn">Внести смену вручную</button>`;
$('#go').onclick=()=>{S.live={date:today(),start:$('#st').value||nowHM(),orders:[],gas:''};save();render()};
$('#mn').onclick=()=>{manual=true;render()};return}
const o=[...L.orders].reverse(),n=o.length;
$('#v').innerHTML=`<h1>Смена идёт 🟢</h1><p class="sub">с ${L.start} · заказов: ${n}</p><div class="card hero" id="pv"></div>
<div class="card"><label>Сумма заказа, ₽<input type="number" inputmode="decimal" id="am" placeholder="600" style="font-size:26px"></label>
<div class="row" style="margin:12px 0"><button class="btn ghost tp ${OT==='card'?'on':''}" data-ty="card">💳 Карта</button><button class="btn ghost tp ${OT==='cash'?'on':''}" data-ty="cash">💵 Наличные</button></div>
<button class="btn" id="ad" style="margin:0">＋ Добавить заказ</button></div>
${n?`<div class="mh"><span>Заказы смены</span><span>${n}</span></div>`+o.map(x=>`<div class="it" style="cursor:default"><div class="d">${x.type==='card'?'💳':'💵'}</div><div class="m"><b>${R(x.amt)}</b><span>${x.type==='card'?'Картой':'Наличными'} · ${x.t}</span></div><button class="x" data-id="${x.id}">✕</button></div>`).join(''):''}
<div class="card g2" style="margin-top:14px"><label>Начало<input type="time" id="st" value="${L.start}"></label><label>Газ, ₽<input type="number" inputmode="decimal" id="gs" value="${L.gas}" placeholder="0"></label></div>
<button class="btn" id="cl" style="background:linear-gradient(135deg,#00b894,#55efc4)">⏹ Закрыть смену</button><button class="btn ghost" id="ca">Отменить смену</button>`;
pv(liveShift());
document.querySelectorAll('.tp').forEach(b=>b.onclick=()=>{OT=b.dataset.ty;document.querySelectorAll('.tp').forEach(x=>x.classList.toggle('on',x===b))});
$('#ad').onclick=()=>{const a=+$('#am').value;if(!(a>0))return toast('Введи сумму');L.orders.push({id:Date.now(),amt:a,type:OT,t:nowHM()});save();vShift();$('#am').focus();toast('Заказ добавлен ✓')};
$('#am').onkeydown=e=>{if(e.key==='Enter')$('#ad').click()};
document.querySelectorAll('.x').forEach(b=>b.onclick=()=>{L.orders=L.orders.filter(x=>x.id!=b.dataset.id);save();vShift()});
$('#st').oninput=e=>{L.start=e.target.value;save();pv(liveShift())};
$('#gs').oninput=e=>{L.gas=e.target.value;save();pv(liveShift())};
$('#cl').onclick=function(){ask(this,'Нажми ещё раз — закрыть',()=>{S.shifts.push({...liveShift(),id:Date.now()});S.live=null;save();toast('Смена закрыта ✓');tab='hist';render()})};
$('#ca').onclick=function(){ask(this,'Нажми ещё раз — удалить всё',()=>{S.live=null;save();render()})}}
function vManual(){const f=F,mo=agg(S.shifts.filter(s=>s.date.slice(0,7)===today().slice(0,7)));
$('#v').innerHTML=`<h1>${edit?'Правка смены':'Новая смена'}</h1><p class="sub">${fd(f.date)} · за месяц ${R(mo.net)}</p>
<div class="card g2"><label>Дата<input type="date" id="date" value="${f.date}"></label><label>Заказов<input type="number" inputmode="numeric" id="orders" value="${f.orders}" placeholder="0"></label>
<label>Начало<input type="time" id="start" value="${f.start}"></label><label>Конец<input type="time" id="end" value="${f.end}"></label>
<label>Картой, ₽<input type="number" inputmode="decimal" id="card" value="${f.card}" placeholder="0"></label><label>Наличными, ₽<input type="number" inputmode="decimal" id="cash" value="${f.cash}" placeholder="0"></label>
<label class="full">Газ (заправка), ₽<input type="number" inputmode="decimal" id="gas" value="${f.gas}" placeholder="0"></label></div>
<div class="card hero" id="pv"></div><button class="btn" id="sv">${edit?'Обновить смену':'Сохранить смену'}</button>
${edit?'<div class="row"><button class="btn ghost" id="cn">Отмена</button><button class="btn del" id="dl">Удалить</button></div>':''}`;
['date','orders','start','end','card','cash','gas'].forEach(k=>$('#'+k).oninput=e=>{F[k]=e.target.value;pv()});pv();
$('#sv').onclick=()=>{if(!F.date||!F.start||!F.end)return toast('Заполни дату и время');
if(edit){S.shifts=S.shifts.map(s=>s.id===edit?{...F,id:edit}:s)}else S.shifts.push({...F,id:Date.now()});
save();edit=null;F=blank();toast('Сохранено ✓');tab='hist';render()};
if(edit){$('#cn').onclick=()=>{edit=null;F=blank();tab='hist';render()};$('#dl').onclick=function(){ask(this,'Нажми ещё раз — удалить',()=>{S.shifts=S.shifts.filter(s=>s.id!==edit);save();edit=null;F=blank();tab='hist';render()})}}}

function vHist(){const l=[...S.shifts].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
if(!l.length){$('#v').innerHTML='<h1>История</h1><div class="empty">🌙<br>Пока нет смен.<br>Добавь первую на вкладке «Смена»</div>';return}
let h='<h1>История</h1><p class="sub">Все твои смены</p>',cur='';
l.forEach(s=>{const k=s.date.slice(0,7);if(k!==cur){cur=k;const a=agg(l.filter(x=>x.date.slice(0,7)===k));
h+=`<div class="mh"><span>${fd(s.date,{month:'long',year:'numeric'})}</span><span>${R(a.net)} · ${a.n} см.</span></div>`}
const c=calc(s);h+=`<div class="it" data-id="${s.id}"><div class="d">${+s.date.slice(8)}</div><div class="m"><b>${fd(s.date,{weekday:'long'})}</b><span>${s.start}–${s.end} · ${c.h.toFixed(1)} ч · ${c.o} зак.</span></div><div class="n">${R(c.net)}</div></div>`});
$('#v').innerHTML=h;document.querySelectorAll('.it').forEach(e=>e.onclick=()=>{const s=S.shifts.find(x=>x.id==e.dataset.id);edit=s.id;F={...s};tab='shift';render()})}

function vStat(){const t=today(),d=new Date(),wd=(d.getDay()+6)%7,mon=new Date(d);mon.setDate(d.getDate()-wd);
const ws=mon.getFullYear()+'-'+p2(mon.getMonth()+1)+'-'+p2(mon.getDate());
const l=S.shifts.filter(s=>per==='all'||(per==='month'?s.date.slice(0,7)===t.slice(0,7):s.date>=ws)).sort((a,b)=>a.date.localeCompare(b.date));
const a=agg(l),last=l.slice(-14),mx=Math.max(1,...last.map(s=>calc(s).net));
$('#v').innerHTML=`<h1>Итоги</h1><p class="sub">Сколько ты заработал</p>
<div class="seg">${[['week','Неделя'],['month','Месяц'],['all','Всё время']].map(x=>`<button data-p="${x[0]}" class="${per===x[0]?'on':''}">${x[1]}</button>`).join('')}</div>
<div class="card hero"><small>Чистыми за период</small><div class="big">${R(a.net)}</div><small>${a.n} смен · ${a.h.toFixed(1)} ч работы</small></div>
<div class="grid"><div><span>Выручка</span><b>${R(a.g)}</b></div><div><span>Пополнено в Анжи</span><b>${R(a.cm)}</b></div><div><span>Налог</span><b>${R(a.tx)}</b></div><div><span>Газ</span><b>${R(a.gas)}</b></div>
<div><span>Заказов</span><b>${a.o}</b></div><div><span>Чистыми в час</span><b>${a.h?R(a.net/a.h):'—'}</b></div><div class="full" style="grid-column:1/-1"><span>Чистыми в среднем за смену</span><b>${a.n?R(a.net/a.n):'—'}</b></div></div>
${last.length?`<div class="card"><label>Чистыми по сменам (последние ${last.length})</label><div class="bars">${last.map(s=>`<i><u style="height:${calc(s).net/mx*100}%"></u>${+s.date.slice(8)}</i>`).join('')}</div></div>`:'<div class="empty">Нет данных за этот период</div>'}`;
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{per=b.dataset.p;vStat()})}

function vSet(){const c=S.set;$('#v').innerHTML=`<h1>Настройки</h1><p class="sub">Проценты и резервная копия</p>
<div class="card g2"><label>Комиссия Анжи, %<input type="number" inputmode="decimal" id="cm" value="${c.comm}"></label><label>Налог самозанятого, %<input type="number" inputmode="decimal" id="tx" value="${c.tax}"></label>
<label class="chk full"><input type="checkbox" id="tc" ${c.taxCash?'checked':''}>Считать налог и с наличных</label>
<p class="note full">По умолчанию налог считается только с оплат картой. Ставка НПД: 4% с физлиц, 6% с юрлиц — проверь свою в «Мой налог».</p></div>
<div class="card"><label>Резервная копия данных</label><textarea id="bk" rows="4" readonly>${JSON.stringify(S)}</textarea>
<div class="row" style="margin-top:10px"><button class="btn ghost" id="cp">Скопировать</button><button class="btn ghost" id="ld">Загрузить</button></div>
<p class="note">Данные хранятся в браузере этого телефона. Скопируй копию в заметки, чтобы не потерять. Для загрузки вставь текст в поле и нажми «Загрузить».</p></div>`;
const up=()=>{S.set={comm:+$('#cm').value||0,tax:+$('#tx').value||0,taxCash:$('#tc').checked};save()};
['cm','tx','tc'].forEach(i=>$('#'+i).onchange=()=>{up();toast('Сохранено ✓')});
$('#cp').onclick=()=>{$('#bk').select();try{navigator.clipboard.writeText($('#bk').value).then(()=>toast('Скопировано ✓'))}catch(e){document.execCommand('copy');toast('Скопировано ✓')}};
$('#ld').onclick=()=>{const t=$('#bk');t.readOnly=false;t.value='';t.focus();t.placeholder='Вставь копию и нажми «Загрузить» ещё раз';
$('#ld').onclick=()=>{try{const d=JSON.parse(t.value);if(!Array.isArray(d.shifts))throw 0;S=d;save();toast('Загружено ✓');vSet()}catch(e){toast('Неверные данные')}}}}
render();
</script></body></html>
